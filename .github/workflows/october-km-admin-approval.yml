name: October KM Admin Approval E2E Gate
on:
  pull_request:
    paths:
      - 'backend/routes/foMissingKmAdminReviewRoutes.js'
      - 'backend/routes/foOctoberClaimsExportRoutes.js'
      - 'backend/server.js'
      - 'src/pages/FOActivities.jsx'
      - 'backend/sql/20261104_october_missing_km_*.sql'
      - '.github/workflows/october-km-admin-approval.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install backend
        run: npm ci --prefix backend
      - name: Backend syntax checks
        run: |
          node --check backend/server.js
          node --check backend/routes/foMissingKmAdminReviewRoutes.js
          node --check backend/routes/foOctoberClaimsExportRoutes.js
      - name: Backend unit tests
        run: npm test --prefix backend
      - name: Install frontend
        run: npm ci
      - name: Frontend production build
        run: npm run build
