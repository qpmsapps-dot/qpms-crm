name: Retail MIS mounted-route authorization

on:
  pull_request:
    paths:
      - 'backend/server.js'
      - 'backend/tests/retailMisMountedAuth.test.js'
      - '.github/workflows/retail-mis-mounted-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Preserve mounted Retail JWT authorization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          base = os.environ.get("BASE_SHA") or subprocess.check_output(["git", "merge-base", "HEAD", "origin/main"], text=True).strip()
          old = subprocess.check_output(["git", "show", f"{base}:backend/server.js"], text=True)
          new = open("backend/server.js", encoding="utf-8").read()
          # The one-time mounted-path hotfix is already in main. Subsequent
          # server releases must preserve that middleware, not replay the hotfix.
          def jwt(source):
            found = re.search(r"^async function requireSupabaseJwt\([^)]*\)\s*\{.*?^\}", source, re.M | re.S)
            if not found: sys.exit("JWT middleware boundary missing")
            return found.group(0)
          if jwt(old) != jwt(new): sys.exit("Retail JWT middleware changed; explicit security review required")
          required = "if (!retailMisApiAllowed(profile,`${request.baseUrl || ''}${request.path}`)) {"
          if new.count(required) != 1: sys.exit("Mounted Retail scope gate missing or ambiguous")
          print("PASS: unchanged JWT middleware and mounted Retail scope gate")
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Server syntax and mounted authorization regressions
        run: |
          node --check backend/server.js
          node --test backend/tests/retailMisMountedAuth.test.js backend/tests/retailMisAccess.test.js backend/tests/retailOos12Routes.test.js backend/tests/retailMisUserManagement.test.js
