name: Retail Cleaning delivery verification
on:
  pull_request:
    paths:
      - 'backend/services/*Cleaning*'
      - 'backend/routes/clientDeepCleaningRoutes.js'
      - 'backend/tests/*Cleaning*'
      - 'backend/server.js'
      - 'Mobile_FO_V2/lib/deep_cleaning/**'
      - 'Mobile_FO_V2/lib/home/home_shell.dart'
      - 'Mobile_FO_V2/test/deep_cleaning_delivery_test.dart'
      - 'Mobile_FO_V2/config/deep_cleaning.dart-defines.example.json'
      - 'scripts/checkRetailCleaningConfiguration.mjs'
      - 'tests/retailCleaningConfiguration.test.js'
      - 'src/pages/reliance-retail/RetailCleaningScheduleViewer.jsx'
      - 'src/pages/DeepCleaning.jsx'
      - 'src/components/Sidebar.jsx'
      - 'src/routes/AppRoutes.jsx'
      - 'src/utils/authRoles.js'
      - 'tests/retailCleaningDeliveryBrowser.test.js'
      - 'supabase/proposals/retail_cleaning_delivery_v1.sql'
      - 'supabase/verification/retail_cleaning_delivery_read_only.sql'
      - '.github/workflows/retail-cleaning-delivery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix backend --no-audit --no-fund
      - name: Scoped backend and access regressions
        run: node --test backend/tests/retailCleaningDelivery.test.js backend/tests/clientDeepCleaningService.test.js backend/tests/accessControlService.test.js backend/tests/retailMisAccess.test.js backend/tests/retailOperations.test.js
      - name: Client configuration secret boundaries (no build)
        run: node --test tests/retailCleaningConfiguration.test.js
      - name: Disposable PostgreSQL tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'cleaning-pg-tools'
          npm install --prefix $tools --no-audit --no-fund embedded-postgres@17.6.0-beta.15 pg@8.16.3
          "RETAIL_MIS_PG_TOOLS=$tools" >> $env:GITHUB_ENV
      - name: PostgreSQL authorization and concurrency tests
        run: node --test backend/tests/retailCleaningDeliveryPostgres.test.js
      - name: Scoped lint and server syntax
        run: |
          node --check backend/server.js
          npx eslint backend/services/retailCleaningDeliveryService.js backend/services/retailCleaningLegacyReadService.js backend/services/clientDeepCleaningService.js backend/routes/clientDeepCleaningRoutes.js src/pages/reliance-retail/RetailCleaningScheduleViewer.jsx src/pages/DeepCleaning.jsx src/components/Sidebar.jsx src/routes/AppRoutes.jsx src/utils/authRoles.js
      - run: npm run build
      - run: npx playwright install chromium
      - run: node --test tests/retailCleaningDeliveryBrowser.test.js
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Flutter source and contract verification (no APK)
        working-directory: Mobile_FO_V2
        run: |
          flutter pub get
          flutter analyze --no-pub lib/deep_cleaning lib/home/home_shell.dart test/deep_cleaning_delivery_test.dart
          flutter test --no-pub test/deep_cleaning_delivery_test.dart test/mobile_roles_test.dart test/auth_session_recovery_test.dart test/checkout_auth_session_contract_test.dart test/split_auth_state_contract_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaning-delivery-synthetic-screenshots
          path: tmp/cleaning-delivery-screenshots/
