name: Retail Attendance exception validation
on:
  pull_request:
    paths:
      - '**/*retailAttendance*'
      - '**/*RetailAttendance*'
      - '.github/retail-attendance-exceptions-pins.json'
      - '.github/workflows/retail-attendance-exceptions.yml'
      - 'supabase/proposals/retail_attendance_exceptions_20261123.sql'
      - 'docs/RETAIL_ATTENDANCE_EXCEPTIONS.md'
      - 'supabase/proposals/retail_attendance_correction_commit_20261124.sql'
      - 'docs/RETAIL_ATTENDANCE_CORRECTION_REPAIR.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require exact reviewed attendance delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '80fe06d842a0efc79c18124dbe16d05ca1bdf34c' }}
        run: node .github/retailAttendanceExceptionsGuard.mjs "$BASE_SHA"
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund
      - name: Scoped lint
        run: npx eslint .github/retailAttendanceCorrectionGuard.mjs backend/services/retailAttendanceCommitService.js backend/routes/retailMisRoutes.js backend/tests/helpers/retailAttendanceCorrectionFixture.js backend/tests/retailAttendanceCorrection.test.js backend/tests/retailAttendanceCorrectionPostgres.test.js src/components/reliance-retail/RetailMisAttendanceUpload.jsx src/utils/retailAttendanceCommit.js tests/retailAttendanceCommit.test.js tests/retailAttendanceCorrectionGuard.test.js tests/browser/retailAttendanceCorrection.spec.js .github/retailAttendanceExceptionsGuard.mjs backend/shared/retailAttendanceExceptions.js backend/services/retailAttendanceService.js backend/services/retailAttendanceExceptionSource.js backend/services/retailAttendanceXlsx.js backend/routes/retailAttendanceRoutes.js backend/tests/retailAttendanceExceptions.test.js backend/tests/retailAttendanceExceptionsPostgres.test.js src/components/reliance-retail/RetailAttendanceExceptions.jsx src/pages/reliance-retail/RetailAttendance.jsx src/services/retailAttendanceApi.js src/utils/retailAttendanceExceptionsExport.js tests/browser/retailAttendanceExceptions.spec.js tests/retailAttendanceExceptionsGuard.test.js
      - name: Reporting, parser, export, authorization and protected calculation regressions
        run: node --test backend/tests/retailAttendanceCorrection.test.js tests/retailAttendanceCommit.test.js tests/retailAttendanceCorrectionGuard.test.js backend/tests/retailAttendanceUploadSize.test.js backend/tests/retailAttendanceExceptions.test.js backend/tests/retailAttendanceXlsx.test.js backend/tests/retailAttendancePreviewAudit.test.js backend/tests/retailAttendanceReportScope.test.js backend/tests/retailAttendanceTrend.test.js backend/tests/retailAttendanceNov2026.test.js backend/tests/retailLeadershipRoleScope.test.js backend/tests/retailMisAccess.test.js backend/tests/retailMisMountedAuth.test.js tests/retailAttendanceExceptionsGuard.test.js tests/retailAttendanceVisualModel.test.js tests/retailAttendanceAopDisplay.test.js tests/thermographyFullstackGuard.test.js tests/deepCleaningV2Guard.test.js tests/trainingExportGuard.test.js tests/deepCleaningExportGuard.test.js
      - name: Provision isolated native PostgreSQL17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --location -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17
          /usr/lib/postgresql/17/bin/postgres --version | grep -E '^postgres \(PostgreSQL\) 17\.'
          npm install --prefix "$RUNNER_TEMP/attendance-tools" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Required native atomicity, concurrency, permissions and performance
        env:
          THERMOGRAPHY_TEST_TOOLS_DIR: ${{ runner.temp }}/attendance-tools
          THERMOGRAPHY_TEST_PG_BIN: /usr/lib/postgresql/17/bin
          THERMOGRAPHY_NATIVE_OUTPUT_DIR: ${{ runner.temp }}
        run: |
          node --test backend/tests/retailAttendanceExceptionsPostgres.test.js
          node --test backend/tests/retailAttendanceCorrectionPostgres.test.js
      - name: Production frontend build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop, tablet, mobile, export and existing Attendance browser checks
        run: npx playwright test --config tests/browser/retailAttendanceCorrection.config.js --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retail-attendance-exception-browser-evidence
          path: test-results/
          retention-days: 7
