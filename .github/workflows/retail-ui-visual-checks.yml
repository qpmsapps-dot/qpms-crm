name: Reliance Retail UI-only verification

on:
  pull_request:
    paths:
      - 'src/pages/reliance-retail/**'
      - 'src/components/reliance-retail/**'
      - '.github/workflows/retail-ui-visual-checks.yml'
      - 'tests/browser/ifmsDashboard.spec.js'
      - 'tests/browser/retailAttendance.spec.js'
      - 'tests/browser/retailReportVisualSmoke.spec.js'
      - 'tests/retailOos*.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, scoped lint, and protected-file guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Protect business logic and other modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          base = os.environ.get("BASE_SHA") or subprocess.check_output(["git","merge-base","HEAD","origin/main"],text=True).strip()
          files = subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines()
          # Exact source-integration exception, covered by retail-cleaning-delivery.yml.
          # No branch-name bypass or broad backend/mobile allowlist. Any payload
          # drift or unrelated file returns to the original strict guard below.
          approved_cleaning_delivery = {
            ".github/workflows/retail-cleaning-delivery.yml": "281782116f11f97c2624b6492af1af142540205d",
            ".github/workflows/retail-mis-mounted-auth.yml": "851294e644c02ebf9e4e98ab2b8337130889e04d",
            "Mobile_FO_V2/config/deep_cleaning.dart-defines.example.json": "bcc6eb4681bb3816e530becf52a98118e6fa34f5",
            "Mobile_FO_V2/lib/deep_cleaning/deep_cleaning_form_screen.dart": "b77ac372753f09bdd4efbfb2654c8cd1cd7858f9",
            "Mobile_FO_V2/lib/deep_cleaning/deep_cleaning_models.dart": "655614f847ff66f951c6fc898f160d013647d547",
            "Mobile_FO_V2/lib/deep_cleaning/deep_cleaning_screen.dart": "a271b492c9c258cf08d0b71a2eeefe682aaa8205",
            "Mobile_FO_V2/lib/deep_cleaning/deep_cleaning_service.dart": "2f44ee0859824a4841ca8c5bbf8b137bafeff2cd",
            "Mobile_FO_V2/lib/home/home_shell.dart": "69bd02c7723498d0859b50b17349132e90a5a128",
            "Mobile_FO_V2/test/deep_cleaning_delivery_test.dart": "8fc07df1e7193dd92c1f6370e5105bb5dfee3e4b",
            "Mobile_FO_V2/test/deep_cleaning_pending_upload_test.dart": "8bce34288d350f97935176895e33e79641f308cf",
            "backend/routes/clientDeepCleaningRoutes.js": "3a8f4a92ff6dc312d1c2bdea725f4bf67643a2c7",
            "backend/server.js": "d9323c4ac1afb7da848cadca48f1d38fc365447d",
            "backend/services/clientDeepCleaningService.js": "1179f5f4e1c8ca0ecf57a9961659a3b4b61b677a",
            "backend/services/retailCleaningDeliveryService.js": "dd92374a6cc4de908b1924732362eaa8764b569e",
            "backend/services/retailCleaningLegacyReadService.js": "770ad1d79e6e8aeeeeb74590374916170120aade",
            "backend/tests/clientDeepCleaningService.test.js": "7097ec223d18204b989371309220016a10a3a737",
            "backend/tests/retailCleaningDelivery.test.js": "1b7d0ff591cb3c101227d3ecaaf170ac6a1e588a",
            "backend/tests/retailCleaningDeliveryPostgres.test.js": "d553a1181d13eb736dd8c82653512ceddc5c422d",
            "docs/RETAIL_CLEANING_DELIVERY_20261103.md": "0a074541aaa78ba6393e73484e6686382c0cca23",
            "docs/RETAIL_CLEANING_IMAGE_CONFIGURATION.md": "bf79435c2aee9c299f5e218b6837e05296bc6ae9",
            "docs/evidence/retail-cleaning-upload-read-only-20261103.json": "f73d059614c48140b68c89bcbd61f39ccdce1a10",
            "scripts/checkRetailCleaningConfiguration.mjs": "f584d1b78d0eb37145e274c0c3e31b3ef9fa5641",
            "src/components/Sidebar.jsx": "2393c3b523e88d889d65b45649a817054505f19b",
            "src/pages/DeepCleaning.jsx": "708d4b64254b3c724504140969ce7bf534f52c87",
            "src/pages/reliance-retail/RetailCleaningScheduleViewer.jsx": "f2b9588b3dc7cae448326bd05489ea9f342575ff",
            "src/routes/AppRoutes.jsx": "2c61768d06c0a27c6f2df6f7430e9427c737fe44",
            "src/utils/authRoles.js": "0179b498c1724aa6953605b2a1b4520ee24d0d80",
            "supabase/proposals/retail_cleaning_delivery_v1.sql": "a4b6344ae81dc0f4b2e05b992e32028c542e6a4d",
            "supabase/verification/retail_cleaning_delivery_read_only.sql": "c0410e4294af3eae44d4e1ccde374e9f15104b37",
            "tests/retailCleaningConfiguration.test.js": "6221cb8258406f6560859ceb3e34d2fb6891ab73",
            "tests/retailCleaningDeliveryBrowser.test.js": "88df53279893a5a6f17befd79b015d2ccc495b48",
          }
          cleaning_diff = set(files) - {".github/workflows/retail-ui-visual-checks.yml"}
          if cleaning_diff == set(approved_cleaning_delivery):
            mismatch = [path for path, expected in approved_cleaning_delivery.items()
                        if subprocess.check_output(["git","hash-object",path],text=True).strip() != expected]
            if mismatch:
              sys.exit("Cleaning integration payload changed; protected review must be renewed: " + ", ".join(mismatch))
            print("PASS: exact Cleaning delivery payload; dedicated backend/PostgreSQL/Flutter checks required.")
            sys.exit(0)
          # One-time, content-pinned operational Retail feature review.
          # This does not broaden the old UI-only path/control guard for other PRs.
          # The feature-specific CI also runs backend tests, scoped lint, build,
          # Retail Playwright smoke tests and OOS browser regressions.
          approved_operational_ui = {
            "src/components/reliance-retail/RetailCleaningSchedule.jsx": "cc3065d685192567a1aaf99c0839901e88f7a863",
            "src/pages/FaultTracker.jsx": "fbe6e2cbd2b4cea6f8c7f7e8f1fdf57991d341b2",
            "src/pages/reliance-retail/RetailOos12Transition.jsx": "6ef026027be5314b888603895b13b27937181f3c",
            "src/pages/reliance-retail/RetailOosDashboard.jsx": "17e27c206bae2e915f50189fe5cc4d971d408d20",
            "src/pages/reliance-retail/RetailOosWorkspace.jsx": "ac85d55fbd95c787dec85261b0cd6a1b3f4c34b5",
            "src/pages/reliance-retail/RetailOperations.jsx": "f25f5a6e0ea74695f8027daa29921a084a1035ad",
            "src/pages/reliance-retail/RetailScopedDeepCleaning.jsx": "47bcc57b5d50844b7af0190b0dd4b1068b8a483d",
            "src/pages/reliance-retail/retailOosWorkspace.css": "8b24a488d72285b16d7c6c4e5815702faf96fb16",
            "src/services/retailUnifiedApi.js": "b603aefd9354bb8c3b2d035febf7055d12788a39",
          }
          operational_diff = set(files) - {".github/workflows/retail-ui-visual-checks.yml"}
          if operational_diff == set(approved_operational_ui):
            mismatch = [path for path, expected in approved_operational_ui.items()
                        if subprocess.check_output(["git","hash-object",path],text=True).strip() != expected]
            if mismatch:
              sys.exit("Operational Retail UI payload changed; protected review must be renewed: " + ", ".join(mismatch))
            print("PASS: exact content-pinned Retail operational UI patch; full UI and operational tests are required.")
            sys.exit(0)
          allowed = {
            "src/components/reliance-retail/retailReport.css",
            "src/pages/reliance-retail/ifmsDashboard.css",
            "src/pages/reliance-retail/retailStoreVisual.css",
            "src/pages/reliance-retail/RetailAttendance.jsx",
            "src/pages/reliance-retail/RetailDashboard.jsx",
            "src/pages/reliance-retail/RetailStoreMaster.jsx",
            "src/pages/reliance-retail/RetailTraining.jsx",
            "src/pages/reliance-retail/RetailScopedDeepCleaning.jsx",
            "src/pages/reliance-retail/RetailOperations.jsx",
            "src/pages/reliance-retail/RetailOosDashboard.jsx",
            ".github/workflows/retail-ui-visual-checks.yml",
            "tests/browser/ifmsDashboard.spec.js",
            "tests/browser/retailAttendance.spec.js",
            "tests/browser/retailReportVisualSmoke.spec.js"
          }
          oos_ui = {
            "src/pages/reliance-retail/RetailOosWorkspace.jsx",
            "src/pages/reliance-retail/RetailOos12Transition.jsx",
            "src/pages/reliance-retail/RetailOosPresentation.jsx",
            "src/pages/reliance-retail/retailOosWorkspace.css"
          }
          allowed |= oos_ui | {
            "tests/retailOosAgeingBrowser.test.js",
            "tests/retailOos12Browser.test.js",
            "tests/retailOosTrainingBrowser.test.js",
            "tests/retailOosUiPresentationBrowser.test.js"
          }
          unexpected = [p for p in files if p not in allowed]
          if unexpected: sys.exit("Unexpected/protected files changed: " + ", ".join(unexpected))
          # The OOS drawer intentionally relocates controls; its behavior is
          # covered by the OOS browser regressions below. Keep the existing
          # control-count guard for the other reporting pages.
          jsx = [p for p in files if p.endswith(".jsx") and p not in oos_ui]
          for path, start, end in [
              ("src/pages/reliance-retail/RetailOos12Transition.jsx", " const requirement=", " return <section"),
              ("src/pages/reliance-retail/RetailOosWorkspace.jsx", " async function commit()", " if(accessError)"),
              ("src/pages/reliance-retail/RetailOosWorkspace.jsx", " async function run(task)", " async function showHistory")
          ]:
            old = subprocess.check_output(["git","show",f"{base}:{path}"],text=True)
            new = open(path,encoding="utf-8").read()
            def protected_region(source):
              return source.split(start,1)[1].split(end,1)[0]
            if protected_region(old) != protected_region(new):
              sys.exit(f"{path}: protected OOS action logic changed")
          for path in jsx:
            old = subprocess.check_output(["git","show",f"{base}:{path}"],text=True)
            new = open(path,encoding="utf-8").read()
            for name,pat in {"buttons":r"<button\b","inputs":r"<input\b","selects":r"<select\b","anchors":r"<a\b","api references":r"Api\.","retail routes":r"/reliance-retail/"}.items():
              if len(re.findall(pat,old)) != len(re.findall(pat,new)):
                sys.exit(f"{path}: {name} count changed")
          print(f"PASS: {len(files)} scoped files; controls and references preserved.")
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint affected UI pages
        run: npx eslint src/pages/reliance-retail/RetailDashboard.jsx src/pages/reliance-retail/RetailAttendance.jsx src/pages/reliance-retail/RetailStoreMaster.jsx src/pages/reliance-retail/RetailTraining.jsx src/pages/reliance-retail/RetailScopedDeepCleaning.jsx src/pages/reliance-retail/RetailOperations.jsx src/pages/reliance-retail/RetailOosDashboard.jsx src/pages/reliance-retail/RetailOosWorkspace.jsx src/pages/reliance-retail/RetailOos12Transition.jsx src/pages/reliance-retail/RetailOosPresentation.jsx
      - name: Production frontend build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Retail report browser regressions and visual smoke
        run: npx playwright test tests/browser/ifmsDashboard.spec.js tests/browser/retailAttendance.spec.js tests/browser/retailReportVisualSmoke.spec.js --reporter=line
      - name: OOS presentation and workflow regressions
        run: node --test --test-concurrency=1 tests/retailOosAgeing.test.js tests/retailOosAgeingBrowser.test.js tests/retailOos12Browser.test.js tests/retailOosTrainingBrowser.test.js tests/retailOosUiPresentationBrowser.test.js
      - name: Upload synthetic visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-ui-synthetic-playwright-evidence
          path: |
            test-results/
            tmp/oos-ui-release-screenshots/
          retention-days: 7
          if-no-files-found: ignore
