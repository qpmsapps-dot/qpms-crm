name: Thermography exact full-stack verification

on:
  pull_request:
    paths:
      - '.github/thermography*'
      - '.github/workflows/thermography-fullstack.yml'
      - '.github/workflows/retail-ui-visual-checks.yml'
      - 'backend/routes/relianceRetailManagementRoutes.js'
      - 'backend/routes/thermographyReportsRoutes.js'
      - 'backend/services/retailModuleReportService.js'
      - 'backend/services/thermography*'
      - 'backend/shared/retailOperations.js'
      - 'backend/tests/helpers/*hermography*'
      - 'backend/tests/thermography*'
      - 'src/components/reliance-retail/*hermography*'
      - 'src/pages/reliance-retail/RetailOperations.jsx'
      - 'src/pages/reliance-retail/RetailMisWorkspace.jsx'
      - 'src/pages/reliance-retail/RetailDashboard.jsx'
      - 'src/utils/retailExecutiveReport.js'
      - 'src/utils/thermography*'
      - 'supabase/**/*thermography*'
      - 'tests/*hermography*'
      - 'tests/trainingExportGuard.test.js'
      - 'tests/deepCleaningExportGuard.test.js'
      - 'tests/retailOperationsShapeBrowser.test.js'
      - 'tests/browser/retailReportVisualSmoke.spec.js'
      - 'docs/THERMOGRAPHY_REPORTS_RELEASE.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Thermography pinned payload, local SQL lifecycle and native concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || '46707ec63c440d015c21339b00c423b461089ff1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require exact reviewed payload and unchanged existing security checks
        run: node .github/thermographyV2Guard.mjs "$BASE_SHA"
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix backend --no-audit --no-fund
      - name: Thermography scoped lint
        run: npx eslint .github/thermographyV2Guard.mjs backend/services/thermographyPdf.js backend/services/thermographySchedule.js backend/services/thermographyScheduleWorker.js backend/services/thermographyDashboard.js src/utils/thermographyV2.js tests/thermographyFullstackGuard.test.js backend/routes/relianceRetailManagementRoutes.js backend/routes/thermographyReportsRoutes.js backend/services/retailModuleReportService.js backend/services/thermographyReportsService.js backend/services/thermographyWorkbook.js backend/shared/retailOperations.js src/components/reliance-retail/ThermographyReports.jsx src/pages/reliance-retail/RetailOperations.jsx src/pages/reliance-retail/RetailMisWorkspace.jsx src/pages/reliance-retail/RetailDashboard.jsx src/utils/thermographyReports.js src/utils/thermographyTusUpload.js tests/thermographyTusUpload.test.js src/utils/retailExecutiveReport.js
      - name: Thermography SQL, permissions, file integrity, limits and authorization regressions
        run: node --test backend/tests/thermographySchedule.test.js backend/tests/thermographyDashboard.test.js tests/thermographyFullstackGuard.test.js tests/trainingExportGuard.test.js tests/deepCleaningExportGuard.test.js backend/tests/thermographyReports.database.test.js backend/tests/thermographyReports.test.js backend/tests/thermographyReports.limits.test.js tests/thermographyReports.test.js tests/thermographyTusUpload.test.js backend/tests/retailMisMountedAuth.test.js
      - name: Shared reporting preservation
        run: node --test backend/tests/retailModuleReportService.test.js tests/retailExecutiveReport.test.js tests/deepCleaningView.test.js
      - name: Provision isolated PostgreSQL 17 test tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent --location -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17
          /usr/lib/postgresql/17/bin/postgres --version | grep -E '^postgres \(PostgreSQL\) 17\.'
          npm install --prefix "$RUNNER_TEMP/thermography-tools" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Required native multi-session concurrency (no opt-in skip)
        env:
          RUN_THERMOGRAPHY_NATIVE_POSTGRES_TESTS: true
          THERMOGRAPHY_TEST_TOOLS_DIR: ${{ runner.temp }}/thermography-tools
          THERMOGRAPHY_TEST_PG_BIN: /usr/lib/postgresql/17/bin
          THERMOGRAPHY_NATIVE_OUTPUT_DIR: ${{ runner.temp }}
        run: node --test backend/tests/thermographyReports.concurrent.test.js
      - name: Production web build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Thermography-only browser lifecycle and report shape
        env:
          THERMOGRAPHY_TEST_OUTPUT_DIR: ${{ runner.temp }}/thermography-v2-screenshots
        run: node --test --test-concurrency=1 tests/thermographyReports.browser.test.js tests/retailOperationsShapeBrowser.test.js
      - name: Upload synthetic Thermography V2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermography-v2-synthetic-browser-evidence
          path: ${{ runner.temp }}/thermography-v2-screenshots
          retention-days: 7
          if-no-files-found: ignore
