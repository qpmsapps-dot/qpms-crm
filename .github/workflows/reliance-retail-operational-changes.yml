name: Reliance Retail operational changes verification
on:
  pull_request:
    paths:
      - 'backend/shared/retailOperations.js'
      - 'backend/shared/retailAttendanceTrend.js'
      - 'backend/services/retailAttendanceService.js'
      - 'backend/services/faultTrackerStoreScope.js'
      - 'backend/services/retailModuleReportService.js'
      - 'backend/services/retailIfmsHistoryService.js'
      - 'backend/routes/relianceRetailManagementRoutes.js'
      - 'src/routes/AppRoutes.jsx'
      - 'src/components/reliance-retail/RetailImportedHistory.jsx'
      - 'backend/services/clientDeepCleaningService.js'
      - 'backend/services/trainingService.js'
      - 'backend/services/retailUnifiedService.js'
      - 'backend/routes/retailUnifiedRoutes.js'
      - 'backend/routes/retailMisRoutes.js'
      - 'backend/routes/clientDeepCleaningRoutes.js'
      - 'backend/shared/retailOos12Workflow.js'
      - 'src/components/reliance-retail/RetailCleaningSchedule.jsx'
      - 'src/pages/reliance-retail/**'
      - 'src/pages/FaultTracker.jsx'
      - 'backend/tests/**'
      - 'supabase/proposals/retail_*_20261103.sql'
      - '.github/workflows/reliance-retail-operational-changes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install package dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Scoped Retail backend tests
        run: node --test backend/tests/retailOperations.test.js backend/tests/faultTrackerStoreScope.test.js backend/tests/clientDeepCleaningService.test.js backend/tests/retailOos12Routes.test.js backend/tests/trainingReleaseCompatibility.test.js backend/tests/retailModuleReportService.test.js backend/tests/retailIfmsHistoryService.test.js backend/tests/retailAttendanceTrend.test.js backend/tests/retailAttendanceReportScope.test.js
      - name: Attendance recovery and matching-period coverage regressions
        run: node --test backend/tests/retailCanonicalAttendanceRecovery.test.js backend/tests/retailAttendancePreviewAudit.test.js backend/tests/retailAttendanceXlsx.test.js backend/tests/retailAttendanceUploadSize.test.js tests/retailAttendanceCoverage.test.js tests/retailAttendanceAopDisplay.test.js tests/retailRecovery.test.js
      - name: Isolated PostgreSQL attendance safeguards
        env:
          RETAIL_ATTENDANCE_POSTGRES: '1'
        run: node --test backend/tests/retailAttendancePostgres.test.js
      - name: Scoped lint
        run: |
          files=(backend/shared/retailAttendanceTrend.js backend/services/retailAttendanceService.js backend/shared/retailOperations.js backend/shared/retailOos12Workflow.js backend/services/faultTrackerStoreScope.js backend/services/clientDeepCleaningService.js backend/services/trainingService.js backend/services/retailUnifiedService.js backend/services/retailModuleReportService.js backend/services/retailIfmsHistoryService.js backend/routes/relianceRetailManagementRoutes.js backend/routes/clientDeepCleaningRoutes.js backend/routes/retailMisRoutes.js backend/routes/retailUnifiedRoutes.js src/components/reliance-retail/RetailCleaningSchedule.jsx src/components/reliance-retail/RetailImportedHistory.jsx src/routes/AppRoutes.jsx src/pages/reliance-retail/RetailManpowerHistory.jsx src/pages/reliance-retail/RetailOperationalTrackers.jsx src/pages/reliance-retail/RetailTraining.jsx src/pages/reliance-retail/RetailScopedDeepCleaning.jsx src/pages/reliance-retail/RetailOosDashboard.jsx src/pages/reliance-retail/RetailDashboard.jsx src/pages/reliance-retail/RetailOos12Transition.jsx src/pages/reliance-retail/RetailOosWorkspace.jsx src/pages/reliance-retail/RetailOperations.jsx src/pages/FaultTracker.jsx)
          present=()
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then present+=("$file"); fi
          done
          npx eslint "${present[@]}"
      - name: Production frontend build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Retail report browser regressions
        run: npx playwright test tests/browser/ifmsDashboard.spec.js tests/browser/retailAttendance.spec.js tests/browser/retailReportVisualSmoke.spec.js --reporter=line
      - name: OOS browser and presentation regressions
        run: node --test --test-concurrency=1 tests/retailOosAgeing.test.js tests/retailOosAgeingBrowser.test.js tests/retailOos12Browser.test.js tests/retailOosTrainingBrowser.test.js tests/retailOosUiPresentationBrowser.test.js
      - name: Upload UI regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-operational-visual-checks
          path: |
            test-results/
            tmp/oos-ui-release-screenshots/
          retention-days: 7
          if-no-files-found: ignore
