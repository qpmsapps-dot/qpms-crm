name: Reliance Retail operational changes verification
on:
  pull_request:
    paths:
      - 'backend/shared/retailOperations.js'
      - 'backend/services/faultTrackerStoreScope.js'
      - 'backend/services/retailModuleReportService.js'
      - 'backend/services/clientDeepCleaningService.js'
      - 'backend/services/trainingService.js'
      - 'backend/services/retailUnifiedService.js'
      - 'backend/routes/retailUnifiedRoutes.js'
      - 'backend/routes/retailMisRoutes.js'
      - 'backend/routes/clientDeepCleaningRoutes.js'
      - 'backend/shared/retailOos12Workflow.js'
      - 'src/components/reliance-retail/RetailCleaningSchedule.jsx'
      - 'src/pages/reliance-retail/**'
      - 'src/pages/FaultTracker.jsx'
      - 'backend/tests/**'
      - 'supabase/proposals/retail_*_20261103.sql'
      - '.github/workflows/reliance-retail-operational-changes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install package dependencies
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Scoped Retail backend tests
        run: node --test backend/tests/retailOperations.test.js backend/tests/faultTrackerStoreScope.test.js backend/tests/clientDeepCleaningService.test.js backend/tests/retailOos12Routes.test.js backend/tests/trainingReleaseCompatibility.test.js backend/tests/retailModuleReportService.test.js
      - name: Scoped lint
        run: npx eslint backend/shared/retailOperations.js backend/shared/retailOos12Workflow.js backend/services/faultTrackerStoreScope.js backend/services/clientDeepCleaningService.js backend/services/trainingService.js backend/services/retailUnifiedService.js backend/services/retailModuleReportService.js backend/routes/clientDeepCleaningRoutes.js backend/routes/retailMisRoutes.js backend/routes/retailUnifiedRoutes.js src/components/reliance-retail/RetailCleaningSchedule.jsx src/pages/reliance-retail/RetailOosDashboard.jsx src/pages/reliance-retail/RetailDashboard.jsx src/pages/reliance-retail/RetailOos12Transition.jsx src/pages/reliance-retail/RetailOosWorkspace.jsx src/pages/reliance-retail/RetailOperations.jsx src/pages/FaultTracker.jsx
      - name: Production frontend build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Retail report browser regressions
        run: npx playwright test tests/browser/ifmsDashboard.spec.js tests/browser/retailAttendance.spec.js tests/browser/retailReportVisualSmoke.spec.js --reporter=line
      - name: OOS browser and presentation regressions
        run: node --test --test-concurrency=1 tests/retailOosAgeing.test.js tests/retailOosAgeingBrowser.test.js tests/retailOos12Browser.test.js tests/retailOosTrainingBrowser.test.js tests/retailOosUiPresentationBrowser.test.js
      - name: Upload UI regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-operational-visual-checks
          path: |
            test-results/
            tmp/oos-ui-release-screenshots/
          retention-days: 7
          if-no-files-found: ignore
